name: DeepSeek Harness benchmark report
description: Share a benchmark or reproducibility run performed through DeepSeek Harness.
title: "[dsh-benchmark] "
labels: ["benchmark", "community", "reproducibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using DeepSeek Harness to audit this repository. These reports
        help test whether an agent can reproduce the benchmark workflow while
        preserving the evidence boundary.

        Please read `AGENTS.md`, `docs/deepseek_harness_recipe.md`, and
        `docs/reality_check.md` before submitting. This report is for engineering
        reproducibility only; it is not trading-performance evidence.

  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: The repository commit used for the run.
      placeholder: fde7416
    validations:
      required: true

  - type: input
    id: harness_version
    attributes:
      label: DeepSeek Harness version or source
      description: Paste the dsh version, package version, or source checkout used.
      placeholder: dsh <version> / deepseek-harness commit <sha>
    validations:
      required: false

  - type: textarea
    id: prompt
    attributes:
      label: Agent prompt
      description: Paste the prompt or task instruction used to run the benchmark.
      render: text
      placeholder: |
        Read AGENTS.md, docs/benchmarking.md, and docs/reality_check.md.
        Run the protocol v1 CPU benchmark exactly as documented...
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command executed by the agent or by you.
      render: bash
      placeholder: python scripts/benchmark_tensor_factors.py --device cpu --n-dates 750 --n-stocks 1000 --window 20 --repeat 10 --warmup 3 --threads 1 --interop-threads 1 --seed 42 --json-out artifacts/benchmark-v1.json
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste OS, CPU/GPU, Python, PyTorch, CUDA availability, protocol, and thread counts.
      placeholder: |
        OS:
        CPU:
        GPU:
        Python:
        PyTorch:
        CUDA available:
        Protocol:
        PyTorch threads:
        PyTorch interop threads:
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Result table
      description: Paste the Markdown table printed by the benchmark script.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: json
    attributes:
      label: JSON report
      description: Attach artifacts/benchmark-v1.json to the issue, or paste it here if attachments are unavailable.
      render: json
    validations:
      required: true

  - type: textarea
    id: transcript
    attributes:
      label: Agent transcript or summary
      description: Paste the relevant DeepSeek Harness transcript excerpt, or summarize what the agent did.
      render: text
    validations:
      required: false

  - type: textarea
    id: caveats
    attributes:
      label: Caveats
      description: Note warnings, instability, fallback behavior, thermal limits, missing data, or anything the agent could not verify.
    validations:
      required: false
